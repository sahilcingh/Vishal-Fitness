org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Works around a Windows-only Kotlin incremental-compiler crash
# (RelocatableFileToPathConverter.toPath -> relativeTo) when the project
# and the Flutter pub cache live on different drive letters (e.g. D:\ vs
# C:\Users\...\Pub\Cache) - relativeTo() can't compute a path across roots.
kotlin.incremental=false
